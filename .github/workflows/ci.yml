name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 PR 多次 push 时取消旧 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-spm:
    name: Apple · SPM build + test
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
      - name: Show Swift version
        run: swift --version
      - name: Build MeshDropKit
        working-directory: apple
        run: swift build
      - name: Run MeshDropKit tests
        working-directory: apple
        run: swift test

  linux-core:
    name: Linux · meshdrop-core test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - name: Build meshdrop-core
        working-directory: linux
        run: cargo build -p meshdrop-core
      - name: Run meshdrop-core unit + integration tests
        working-directory: linux
        run: cargo test -p meshdrop-core

  android-unit:
    name: Android · :app unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - name: Run :app JVM unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  web-build:
    name: Web · npm build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build

  windows-build:
    name: Windows · MeshDrop build
    runs-on: windows-latest
    timeout-minutes: 25
    # dotnet CLI 在 windows-latest 上 XAML MarkupCompilePass2 静默 exit 1
    # （PR #45 / #46 验过 WinAppSDK 1.6 / 1.7 都一样）；microsoft/setup-msbuild
    # 走 VS Build Tools 完整工具链能让真实 XAML 错误显形，配合 record body
    # 显式 set 与 IReadOnlyList<int> 修复后真过
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v3
      - name: Restore packages
        working-directory: windows
        run: msbuild MeshDrop.sln -t:Restore -p:Configuration=Release -p:Platform=x64
      - name: Build
        working-directory: windows
        run: msbuild MeshDrop.sln -t:Build -p:Configuration=Release -p:Platform=x64 -v:minimal

  protocol-vectors-consistency:
    name: Protocol · testdata frame_bytes_hex 一致性
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frame_bytes_hex = u32(BE length) + type + body_bytes_hex
        run: |
          python3 - <<'EOF'
          import json, glob, struct, sys

          fail = False
          for path in sorted(glob.glob('protocol/testdata/frames/*.json')):
              with open(path) as f:
                  spec = json.load(f)
              body_hex = spec['body_bytes_hex']
              frame_hex = spec['frame_bytes_hex']
              body_bytes = bytes.fromhex(body_hex)
              type_byte = int(spec['type_hex'], 16)
              expected = struct.pack('>I', 1 + len(body_bytes)) + bytes([type_byte]) + body_bytes
              if expected.hex() != frame_hex:
                  print(f'FAIL {path}')
                  print(f'  expected: {expected.hex()}')
                  print(f'  spec    : {frame_hex}')
                  fail = True
              else:
                  print(f'OK   {path}')
          sys.exit(1 if fail else 0)
          EOF
