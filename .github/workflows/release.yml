name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签；已发布版本只补充缺失产物，保留已有二进制'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate tag and source versions
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/check-release-version.py "$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  apple:
    name: Apple · ${{ matrix.app }}
    needs: version
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: MeshDropiOS
            destination: iOS
          - app: MeshDropTV
            destination: tvOS
          - app: MeshDropVision
            destination: visionOS
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Test shared Apple core
        if: matrix.app == 'MeshDropiOS'
        run: swift test --package-path apple
      - name: Build device app and bundled companions
        env:
          APP: ${{ matrix.app }}
          DESTINATION: ${{ matrix.destination }}
        run: |
          brew install xcodegen
          xcodegen generate --spec "apple/$APP/project.yml"
          xcodebuild -project "apple/$APP/$APP.xcodeproj" -scheme "$APP" -configuration Release -destination "generic/platform=$DESTINATION" CODE_SIGNING_ALLOWED=NO build

  macos:
    name: macOS · universal signed download
    needs: version
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
      - name: Reuse published signed download
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p release-assets
          if gh release download "$RELEASE_TAG" --pattern "MeshDrop-$RELEASE_TAG-macos-universal.zip" --dir release-assets; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.existing.outputs.found != 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Configure signing and notarization
        if: steps.existing.outputs.found != 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_PROVISION_PROFILE: ${{ secrets.MACOS_PROVISION_PROFILE }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash .release-tools/scripts/setup-macos-signing.sh
      - name: Build, sign and notarize universal app
        if: steps.existing.outputs.found != 'true'
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          brew install xcodegen
          npm ci --prefix web
          bash .release-tools/scripts/build-macos-release.sh "$RELEASE_TAG"
      - name: Verify downloaded or newly built app
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          ditto -x -k "release-assets/MeshDrop-$RELEASE_TAG-macos-universal.zip" "$RUNNER_TEMP/mac-verify"
          app="$RUNNER_TEMP/mac-verify/MeshDrop.app"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          for architecture in arm64 x86_64; do
            lipo "$app/Contents/MacOS/MeshDrop" -verify_arch "$architecture"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: ${{ matrix.project }} · signed APK + AAB
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [android, wearos]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and sign Android packages
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          PROJECT: ${{ matrix.project }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Configure Android release signing secrets before publishing.'; exit 1; }
          export ANDROID_KEYSTORE="$RUNNER_TEMP/meshdrop-release.jks"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
          trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
          bash .release-tools/scripts/build-android-release.sh "$PROJECT" "$RELEASE_TAG"
      - name: Preserve already published binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python3 .release-tools/scripts/release-assets.py reuse "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.project }}
          path: |
            release-assets/*.apk
            release-assets/*.aab
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux · GUI + TUI · ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - name: Install packaging and GUI libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev dpkg-dev xvfb
      - name: Test and build native binaries
        working-directory: linux
        run: |
          cargo test -p meshdrop-core -p meshdrop-tui
          cargo build --release -p meshdrop-gui -p meshdrop-tui
          ./target/release/meshdrop-tui --version
          ./target/release/meshdrop-tui --help
          ldd target/release/meshdrop | tee target/gui-libraries.txt
          ! grep -q 'not found' target/gui-libraries.txt
      - name: Smoke test desktop startup under a virtual display
        working-directory: linux
        run: |
          status=0
          timeout 10s dbus-run-session -- xvfb-run -a ./target/release/meshdrop > target/gui-startup.log 2>&1 || status=$?
          cat target/gui-startup.log
          test "$status" = 124
      - name: Package desktop and terminal downloads
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: bash .release-tools/scripts/package-linux.sh "$RELEASE_TAG" "$RELEASE_ARCH"
      - name: Preserve already published binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python3 .release-tools/scripts/release-assets.py reuse "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  web:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test and package Web Gateway client
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          npm ci --prefix web
          npm test --prefix web
          npm run build --prefix web
          mkdir -p release-assets
          cp LICENSE web/README.md web/dist/
          cd web/dist
          zip -r "../../release-assets/MeshDrop-$RELEASE_TAG-web.zip" .
      - name: Preserve already published binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python3 .release-tools/scripts/release-assets.py reuse "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows · ${{ matrix.architecture }}
    needs: version
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
      - name: Check out pinned libsodium 1.0.19 sources for ARM64
        if: matrix.architecture == 'ARM64'
        uses: actions/checkout@v7
        with:
          repository: jedisct1/libsodium
          ref: fb4533b0a941b3a5b1db5687d1b008a5853d1f29
          path: .sodium-source
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v3
      - name: Test packaging and transport
        run: |
          python -m unittest discover -s .release-tools/scripts/tests -p test_windows_package.py
          dotnet test windows/MeshDrop.Transport.Tests/MeshDrop.Transport.Tests.csproj -c Release --verbosity minimal
      - name: Build portable ZIP and Store package
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_ARCH: ${{ matrix.architecture }}
        run: |
          ./.release-tools/scripts/build-windows-release.ps1 -Architecture $env:RELEASE_ARCH -Tag $env:RELEASE_TAG -SodiumSource "$pwd/.sodium-source"
          python .release-tools/scripts/check-windows-package.py "release-assets/MeshDrop-$env:RELEASE_TAG-windows-$($env:RELEASE_ARCH.ToLowerInvariant()).zip" $env:RELEASE_ARCH
      - name: Preserve already published binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python .release-tools/scripts/release-assets.py reuse "$env:RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: windows-symbols-${{ matrix.architecture }}
          path: windows/artifacts/store/**/*.msixsym
          if-no-files-found: error
          retention-days: 14

  windows-arm64-test:
    name: Windows ARM64 · native crypto and transport
    needs: [version, windows]
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: release-windows-ARM64
          path: release-assets
      - name: Test using the shipped ARM64 runtime
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          Expand-Archive "release-assets/MeshDrop-$env:RELEASE_TAG-windows-arm64.zip" -DestinationPath package
          dotnet build windows/MeshDrop.Transport.Tests/MeshDrop.Transport.Tests.csproj -c Release -r win-arm64
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 test build failed.' }
          Copy-Item package/libsodium.dll windows/MeshDrop.Transport.Tests/bin/Release/net8.0/win-arm64/
          dotnet test windows/MeshDrop.Transport.Tests/MeshDrop.Transport.Tests.csproj -c Release -r win-arm64 --no-build --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 runtime tests failed.' }

  publish:
    needs: [version, apple, macos, android, linux, web, windows, windows-arm64-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Validate complete release, notes and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          python3 -m unittest discover -s .release-tools/scripts/tests -p test_release_assets.py
          python3 .release-tools/scripts/release-assets.py collect "$RELEASE_TAG"
          python3 .release-tools/scripts/release-notes.py "$RELEASE_TAG" > release-assets/CHANGELOG.md
          python3 .release-tools/scripts/release-assets.py prepare "$RELEASE_TAG"
      - name: Publish all verified platforms
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python3 .release-tools/scripts/release-assets.py publish "$RELEASE_TAG"
