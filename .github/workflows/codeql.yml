name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一早 03:00 UTC 跑一遍，覆盖 dep 漂移引入的新漏洞
    - cron: '0 3 * * 1'

# 同一 PR 多次 push 时取消旧 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze · ${{ matrix.language }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # TypeScript / JavaScript：web/ react 端
          - language: javascript-typescript
            runner: ubuntu-latest
          # Swift：apple/ MeshDropKit + 5 个 app target
          - language: swift
            runner: macos-14
          # Kotlin：android/ + wearos/
          - language: kotlin
            runner: ubuntu-latest
          # C#：windows/ MeshDrop
          - language: csharp
            runner: windows-latest

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-extended 比 default 多覆盖一些 less-common 但真实的漏洞模式
          queries: security-extended

      # Swift / C# / Kotlin 都需要先 build 一次让 CodeQL 抓 AST
      - name: Setup .NET (csharp only)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild (csharp only)
        if: matrix.language == 'csharp'
        uses: microsoft/setup-msbuild@v3

      - name: Build C# project
        if: matrix.language == 'csharp'
        working-directory: windows
        run: |
          msbuild MeshDrop.sln -t:Restore -p:Configuration=Release -p:Platform=x64
          msbuild MeshDrop.sln -t:Build -p:Configuration=Release -p:Platform=x64

      - name: Setup Java (kotlin only)
        if: matrix.language == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK (kotlin only)
        if: matrix.language == 'kotlin'
        uses: android-actions/setup-android@v3

      - name: Build Android :app (kotlin only)
        if: matrix.language == 'kotlin'
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Build Swift package (swift only)
        if: matrix.language == 'swift'
        working-directory: apple
        run: swift build

      # JS/TS 是 autobuild，CodeQL 自动跑
      - name: Autobuild (js/ts)
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
