version: 2

# 每周一早上 09:00 检查各端依赖，开 PR 提议升级。
# 同一时间窗最多 5 个 PR，避免噪音；major 升级单独走（标 ignore，手工 review）。

updates:
  # ─── Web（vite / react / 其它 npm） ──────────────────────────────────
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, web]
    commit-message:
      prefix: "web(deps)"
    # 主版本升级单独 review，避免自动 PR breaking change
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─── Linux（cargo workspace） ────────────────────────────────────────
  - package-ecosystem: cargo
    directory: /linux
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, linux]
    commit-message:
      prefix: "linux(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─── Android / Wear OS（gradle） ─────────────────────────────────────
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, android]
    commit-message:
      prefix: "android(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /wearos
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, wearos]
    commit-message:
      prefix: "wearos(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─── Windows（NuGet） ────────────────────────────────────────────────
  - package-ecosystem: nuget
    directory: /windows/MeshDrop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, windows]
    commit-message:
      prefix: "windows(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─── Apple Swift Package（swift-certificates 等） ────────────────────
  - package-ecosystem: swift
    directory: /apple
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, apple]
    commit-message:
      prefix: "apple(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─── GitHub Actions 本身 ─────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci(deps)"
