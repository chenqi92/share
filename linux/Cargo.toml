[package]
name = "meshdrop"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Cross-platform LAN share (Linux client)"

[[bin]]
name = "meshdrop"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
glib = "0.20"

mdns-sd = "0.18"

ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

dirs = "5"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
async-channel = "2"
