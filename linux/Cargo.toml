[workspace]
resolver = "2"
members = [
    "crates/meshdrop-core",
    "crates/meshdrop-gui",
    "crates/meshdrop-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
mdns-sd = "0.18"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.11"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "fs", "time", "macros"] }
async-channel = "2"
dirs = "5"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

# Web Gateway 依赖（backend 接入轮新增）
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rcgen = "0.13"
httparse = "1.9"
futures-util = "0.3"
sha1 = "0.10"
