name: MeshDropTV
options:
  bundleIdPrefix: com.welape.meshdrop
  deploymentTarget:
    tvOS: "17.0"
  developmentLanguage: zh-Hans
  schemePathPrefix: "../"
  generateEmptyDirectories: true

schemes:
  MeshDropTV:
    build:
      targets:
        MeshDropTV: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"

packages:
  MeshDropKit:
    path: ../

targets:
  MeshDropTV:
    type: application
    platform: tvOS
    sources:
      - Sources
      - path: Resources
        excludes:
          - Info.plist
    dependencies:
      - package: MeshDropKit
        product: MeshDropKit
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: MeshDropTV
        CFBundleDisplayName: MeshDrop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiredDeviceCapabilities:
          - arm64
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: 用于发现同一网络下的 MeshDrop 设备
        NSBonjourServices:
          - _meshdrop._tcp
        NSHumanReadableCopyright: "© 2026 MeshDrop"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welape.landrop
        PRODUCT_NAME: MeshDropTV
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2U97K3U27A
