name: MeshDropiOS
options:
  bundleIdPrefix: com.welape.meshdrop
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad

packages:
  MeshDropKit:
    path: ../

targets:
  MeshDropiOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes:
          - Info.plist     # Info.plist 由 info.path 单独处理，避免重复加入
          - MeshDropiOS.entitlements   # entitlements 单独引
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: MeshDrop
        CFBundleDisplayName: MeshDrop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 用于发现同一局域网下的 MeshDrop 设备
        NSBonjourServices:
          - _meshdrop._tcp
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welape.meshdrop
        PRODUCT_NAME: MeshDrop
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2U97K3U27A
        CODE_SIGN_ENTITLEMENTS: Resources/MeshDropiOS.entitlements
    dependencies:
      - package: MeshDropKit
        product: MeshDropKit
      - target: MeshDropShareExtension
        embed: true
        codeSign: true
      - target: MeshDropWidgets
        embed: true
        codeSign: true

  MeshDropShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ../MeshDropShareExtensionIOS/Sources
    info:
      path: ../MeshDropShareExtensionIOS/Info.plist
      properties:
        CFBundleDisplayName: MeshDrop
        CFBundleName: MeshDropShareExtension
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 5
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 20
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welape.meshdrop.share
        PRODUCT_NAME: MeshDropShareExtension
        PRODUCT_MODULE_NAME: MeshDropShareExtension
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2U97K3U27A
        CODE_SIGN_ENTITLEMENTS: ../MeshDropShareExtensionIOS/MeshDropShareExtensionIOS.entitlements
        # SLComposeServiceViewController 在 Social.framework，无需手动链接
    dependencies:
      - package: MeshDropKit
        product: MeshDropKit

  # Live Activity / 灵动岛 的 Widget Extension。共享 MeshDropKit 里的
  # MeshDropTransferActivityAttributes（主 app 与本扩展用同一份类型）。
  MeshDropWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ../MeshDropWidgets/Sources
    info:
      path: ../MeshDropWidgets/Info.plist
      properties:
        CFBundleDisplayName: MeshDrop
        CFBundleName: MeshDropWidgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welape.meshdrop.widgets
        PRODUCT_NAME: MeshDropWidgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2U97K3U27A
        CODE_SIGN_ENTITLEMENTS: ../MeshDropWidgets/MeshDropWidgets.entitlements
    dependencies:
      - package: MeshDropKit
        product: MeshDropKit
