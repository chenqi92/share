name: MeshDropiOS
options:
  bundleIdPrefix: com.welape.landrop
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans

# i18n：默认简体中文 + 英文。各 target 的 Resources/Localizable.xcstrings 提供两份文案。
knownRegions:
  - zh-Hans
  - en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad

packages:
  MeshDropKit:
    path: ../

targets:
  MeshDropiOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes:
          - Info.plist     # Info.plist 由 info.path 单独处理，避免重复加入
          - MeshDropiOS.entitlements   # entitlements 单独引
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: MeshDrop
        CFBundleDisplayName: MeshDrop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 用于发现同一局域网下的 MeshDrop 设备
        NSBonjourServices:
          - _meshdrop._tcp
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welape.landrop
        PRODUCT_NAME: MeshDrop
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2U97K3U27A
        CODE_SIGN_ENTITLEMENTS: Resources/MeshDropiOS.entitlements
    dependencies:
      - package: MeshDropKit
        product: MeshDropKit
      - target: MeshDropShareExtension
        embed: true
        codeSign: true
      - target: MeshDropWidgets
        embed: true
        codeSign: true
      - target: MeshDropWatch
        embed: true
        codeSign: true

  MeshDropShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ../MeshDropShareExtensionIOS/Sources
    info:
      path: ../MeshDropShareExtensionIOS/Info.plist
      properties:
        CFBundleDisplayName: MeshDrop
        CFBundleName: MeshDropShareExtension
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 5
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 20
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welape.landrop.share
        PRODUCT_NAME: MeshDropShareExtension
        PRODUCT_MODULE_NAME: MeshDropShareExtension
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2U97K3U27A
        CODE_SIGN_ENTITLEMENTS: ../MeshDropShareExtensionIOS/MeshDropShareExtensionIOS.entitlements
        # SLComposeServiceViewController 在 Social.framework，无需手动链接
    dependencies:
      - package: MeshDropKit
        product: MeshDropKit

  # Live Activity / 灵动岛 的 Widget Extension。共享 MeshDropKit 里的
  # MeshDropTransferActivityAttributes（主 app 与本扩展用同一份类型）。
  MeshDropWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ../MeshDropWidgets/Sources
      - ../MeshDropWidgets/Resources    # Localizable.xcstrings（zh-Hans + en）
    info:
      path: ../MeshDropWidgets/Info.plist
      properties:
        CFBundleDisplayName: MeshDrop
        CFBundleName: MeshDropWidgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welape.landrop.widgets
        PRODUCT_NAME: MeshDropWidgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2U97K3U27A
        CODE_SIGN_ENTITLEMENTS: ../MeshDropWidgets/MeshDropWidgets.entitlements
    dependencies:
      - package: MeshDropKit
        product: MeshDropKit

  # ── 内嵌的 watchOS companion app（源码仍在 ../MeshDropWatch）──
  # 经 WatchConnectivity 桥接 iPhone；作为 companion 由本 iOS app 一并打包上架。
  MeshDropWatch:
    type: application
    platform: watchOS
    sources:
      - ../MeshDropWatch/Sources
      - path: ../MeshDropWatch/Resources
        excludes:
          - Info.plist
          - MeshDropWatch.entitlements
    info:
      path: ../MeshDropWatch/Resources/Info.plist
      properties:
        CFBundleName: MeshDrop
        CFBundleDisplayName: MeshDrop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.welape.landrop
        WKSupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: 用于发现同一网络下的 MeshDrop 设备
        NSBonjourServices:
          - _meshdrop._tcp
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welape.landrop.watch
        PRODUCT_NAME: MeshDropWatch   # 产物名需与 iOS app(MeshDrop) 区分；显示名走 CFBundleDisplayName
        GENERATE_INFOPLIST_FILE: NO
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: 2U97K3U27A
        CODE_SIGN_ENTITLEMENTS: ../MeshDropWatch/Resources/MeshDropWatch.entitlements
    dependencies:
      - target: MeshDropWatchComplications
        embed: true
        codeSign: true

  MeshDropWatchComplications:
    type: app-extension
    platform: watchOS
    sources:
      - ../MeshDropWatchComplications/Sources
      - ../MeshDropWatchComplications/Resources
      - ../MeshDropWatch/Sources/bridge/ComplicationSnapshot.swift
    info:
      path: ../MeshDropWatchComplications/Info.plist
      properties:
        CFBundleDisplayName: MeshDrop
        CFBundleName: MeshDropWatchComplications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welape.landrop.watch.complications
        PRODUCT_NAME: MeshDropWatchComplications
        GENERATE_INFOPLIST_FILE: NO
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2U97K3U27A
        CODE_SIGN_ENTITLEMENTS: ../MeshDropWatchComplications/MeshDropWatchComplications.entitlements

# 显式 scheme：加入 watchOS target 后 xcodegen 不再自动为 app target 生成 scheme，
# 这里手动声明，保证 Xcode 归档 / 命令行构建可用。
schemes:
  MeshDropiOS:
    build:
      targets:
        MeshDropiOS: all
    run:
      config: Debug
    archive:
      config: Release
  MeshDropWatch:
    build:
      targets:
        MeshDropWatch: all
    run:
      config: Debug
    archive:
      config: Release
