name: ShareiOS
options:
  bundleIdPrefix: com.welape.meshdrop
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad

packages:
  ShareKit:
    path: ../

targets:
  ShareiOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes:
          - Info.plist     # Info.plist 由 info.path 单独处理，避免重复加入
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: MeshDrop
        CFBundleDisplayName: MeshDrop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 用于发现同一局域网下的 MeshDrop 设备
        NSBonjourServices:
          - _meshdrop._tcp
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welape.landrop
        PRODUCT_NAME: MeshDrop
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2U97K3U27A
    dependencies:
      - package: ShareKit
        product: ShareKit
