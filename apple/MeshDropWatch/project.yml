name: MeshDropWatch
options:
  bundleIdPrefix: com.welape.meshdrop
  deploymentTarget:
    watchOS: "10.0"
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"

targets:
  MeshDropWatch:
    type: application
    platform: watchOS
    sources:
      - Sources
      - path: Resources
        excludes:
          - Info.plist
          - MeshDropWatch.entitlements
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: MeshDrop
        CFBundleDisplayName: MeshDrop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        UIRequiredDeviceCapabilities:
          - watch-companion
        WKSupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: 用于发现同一网络下的 MeshDrop 设备
        NSBonjourServices:
          - _meshdrop._tcp
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welape.meshdrop.watch
        PRODUCT_NAME: MeshDrop
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: 2U97K3U27A
        CODE_SIGN_ENTITLEMENTS: Resources/MeshDropWatch.entitlements
    dependencies:
      - target: MeshDropWatchComplications
        embed: true
        codeSign: true

  # 表盘复杂功能（WidgetKit）。读 App Group 共享快照（ComplicationSnapshot.swift），
  # 与 watch app 用同一个 group.com.welape.meshdrop。
  MeshDropWatchComplications:
    type: app-extension
    platform: watchOS
    sources:
      - ../MeshDropWatchComplications/Sources
      - Sources/bridge/ComplicationSnapshot.swift   # 与 watch app 共享同一份快照读写代码
    info:
      path: ../MeshDropWatchComplications/Info.plist
      properties:
        CFBundleDisplayName: MeshDrop
        CFBundleName: MeshDropWatchComplications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welape.meshdrop.watch.complications
        PRODUCT_NAME: MeshDropWatchComplications
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2U97K3U27A
        CODE_SIGN_ENTITLEMENTS: ../MeshDropWatchComplications/MeshDropWatchComplications.entitlements
