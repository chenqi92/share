name: MeshDropMac
options:
  bundleIdPrefix: com.welape.landrop
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: zh-Hans
  # String Catalog 本地化：简体中文（默认）+ English
  knownRegions:
    - zh-Hans
    - en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.10"

packages:
  MeshDropKit:
    path: ../

targets:
  MeshDropMac:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        excludes:
          - Info.plist
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: MeshDrop
        CFBundleDisplayName: MeshDrop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSLocalNetworkUsageDescription: 用于发现同一局域网内的 MeshDrop 设备
        NSBonjourServices:
          - _meshdrop._tcp
        NSHumanReadableCopyright: "© 2026 MeshDrop"
        LSApplicationCategoryType: public.app-category.utilities
    entitlements:
      path: MeshDrop.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.user-selected.read-write: true
        # 沙盒下向钥匙串添加私钥(Web Gateway 的 TLS SecIdentity)需要显式 keychain group，
        # 否则 SecItemAdd 返回 -34018(errSecMissingEntitlement)，网关因建不出证书而启动失败。
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.welape.landrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.welape.landrop
        PRODUCT_NAME: MeshDrop
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2U97K3U27A
    dependencies:
      - package: MeshDropKit
        product: MeshDropKit
